name: GPT BORSA H9 Shadow
on:
  push:
    branches: [gpt-borsa-h9-20260818]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  h9:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install KAP DOM parser
        run: pip -q install beautifulsoup4
      - name: Smoke-test KAP taxonomy parser
        run: python tools/h9_parser_smoke.py
