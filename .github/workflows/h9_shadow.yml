name: GPT BORSA H9 Shadow
on:
  push:
    branches: [gpt-borsa-h9-20260818]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  h9:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full preregistered H9 shadow
        run: python tools/h9_shadow_run.py
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-borsa-h9-pead-shadow
          path: |
            h9_results.csv
            h9_summary.csv
            h9_universe.csv
            h9_coverage.csv
          retention-days: 7
