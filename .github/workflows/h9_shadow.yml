name: GPT BORSA H9 Shadow
on:
  push:
    branches: [gpt-borsa-h9-20260818]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  h9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install KAP DOM parser
        run: pip -q install beautifulsoup4
      - name: Retry 51 rate-limited KAP reports
        run: python tools/h9_retry_51.py
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-borsa-h9-retry-51
          path: h9_retry_51.csv
          retention-days: 7
