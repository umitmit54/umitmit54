name: S5 V3 Flow Holdout
on:
  push:
    paths:
      - 'bist-s4-backtest/s5_v3_flow.py'
      - '.github/workflows/s5-v3-flow.yml'
  workflow_dispatch:
jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r bist-s4-backtest/requirements.txt
      - name: Run S5 V3 flow holdout
        run: python bist-s4-backtest/s5_v3_flow.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: s5-v3-flow-results
          path: bist-s4-backtest/output_s5v3/
          retention-days: 90
