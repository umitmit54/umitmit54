name: UOS Alias Probe
on:
  push:
    branches: [uos-data-collector-20260906]
    paths:
      - 'uos-data-collector/probe_isyatirim_aliases.py'
      - '.github/workflows/uos-alias-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas
      - run: python uos-data-collector/probe_isyatirim_aliases.py
      - uses: actions/upload-artifact@v4
        with:
          name: UOS_ISY_ALIAS_PROBE
          path: uos-alias-probe/
          retention-days: 7
