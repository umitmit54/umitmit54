name: UOS Data Collector

on:
  push:
    branches:
      - uos-data-collector-20260906
    paths:
      - 'uos-data-collector/**'
      - '.github/workflows/uos-data-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas yfinance

      - name: Collect verified-source market data
        run: python uos-data-collector/collect_market_data.py

      - name: Package output
        if: always()
        run: |
          cd uos-data-collector
          if [ -d output ]; then zip -qr UOS_MARKET_DATA_2026-09-06.zip output; fi

      - name: Upload collection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UOS_MARKET_DATA_2026-09-06
          path: |
            uos-data-collector/UOS_MARKET_DATA_2026-09-06.zip
            uos-data-collector/output/
          if-no-files-found: warn
          retention-days: 14
