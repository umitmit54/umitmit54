name: UOS LRSHO Probe
on:
  push:
    branches: [uos-data-collector-20260906]
    paths:
      - 'uos-data-collector/probe_lrsho_borsapy.py'
      - '.github/workflows/uos-lrsho-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas borsapy
      - run: python uos-data-collector/probe_lrsho_borsapy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UOS_LRSHO_PROBE
          path: uos-lrsho-probe/
          retention-days: 7
