name: UOS MAZDA 2011-2015 Blind Fast
on:
  push:
    branches: [uos-borsa-data-job]
    paths: ['.github/workflows/uos-mazda-2011-2015-blind-fast.yml']
  workflow_dispatch:
jobs:
  year:
    strategy:
      fail-fast: false
      matrix:
        year: [2011,2012,2013,2014,2015]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pandas numpy requests xlrd websocket-client git+https://github.com/rongardF/tvdatafeed.git
      - env: {YEAR: '${{ matrix.year }}'}
        run: |
          python - <<'PY'
          import io,os,re,time,zipfile,json
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import pandas as pd,numpy as np,requests,xlrd
          from tvDatafeed import TvDatafeed,Interval
          y=int(os.environ['YEAR']); tv=TvDatafeed(); b=tv.get_hist('XU100','BIST',Interval.in_daily,n_bars=5000)
          if b is None or b.empty: raise RuntimeError('benchmark_empty')
          b=b.reset_index(); b['date']=pd.to_datetime(b.iloc[:,0],errors='coerce').dt.strftime('%Y-%m-%d'); b=b[(b.date>=f'{y}-01-01')&(b.date<=f'{y}-12-31')]
          days=sorted(set(b.date.dropna())); print('days',len(days),flush=True)
          def fetch(ds):
            d=pd.Timestamp(ds); u=f'https://borsaistanbul.com/data/thb/{d:%Y}/{d:%m}/thb{d:%Y%m%d}2.zip'
            try:
              r=requests.get(u,timeout=20,headers={'User-Agent':'Mozilla/5.0 UOS-MAZDA/1'}); return ds,(r.content if r.status_code==200 and r.content[:2]==b'PK' else None),r.status_code
            except Exception as e:return ds,None,'ERR:'+type(e).__name__
          got={};st={};pending=set(days)
          for a in range(1,6):
            with ThreadPoolExecutor(max_workers=20) as ex:
              for f in as_completed([ex.submit(fetch,d) for d in pending]):
                ds,raw,s=f.result();st[ds]=s
                if raw is not None:got[ds]=raw
            pending={d for d in pending if d not in got and (str(st.get(d,'')).startswith('ERR') or st.get(d) in (408,429,500,502,503,504))}
            print('fetch',a,len(got),'retry',len(pending),flush=True)
            if not pending:break
            time.sleep(a)
          missing=[d for d in days if d not in got]
          # Some historical session2 may have a permanent missing file; fail rather than fabricate.
          if missing: raise RuntimeError('missing_session2:'+','.join(missing[:20]))
          rows=[];errs=[]
          for ds,zbytes in sorted(got.items()):
            try:
              with zipfile.ZipFile(io.BytesIO(zbytes)) as z:
                n=next((x for x in z.namelist() if x.lower().endswith(('.xls','.csv'))),None);raw=z.read(n) if n else None
              if not n:raise ValueError('no_datafile')
              if n.lower().endswith('.csv'):
                text=raw.decode('cp1254',errors='replace');ls=text.splitlines();skip=1 if len(ls)>1 and ls[1].startswith('TRADE DATE;') else 0;d=pd.read_csv(io.StringIO(text),sep=';',skiprows=skip,low_memory=False)
                q=d[(d['INSTRUMENT GROUP'].astype(str).str.strip()=='EQT')&d['INSTRUMENT SERIES CODE'].astype(str).str.endswith('.E')]
                for _,r in q.iterrows(): rows.append((ds,str(r['INSTRUMENT SERIES CODE'])[:-2],float(r['CLOSING PRICE']),float(r['TOTAL TRADED VALUE']),int(pd.to_numeric(r.get('BIST 100 INDEX',0),errors='coerce') or 0)))
              else:
                book=xlrd.open_workbook(file_contents=raw,on_demand=True)
                for shn in book.sheet_names():
                  if not re.match(r'^[A-Z]+2-\s*1$',shn):continue
                  sh=book.sheet_by_name(shn)
                  for ri in range(sh.nrows):
                    vals=[sh.cell_value(ri,ci) for ci in range(sh.ncols)]
                    txt=[str(v).strip() for v in vals]; ti=next((i for i,v in enumerate(txt) if re.fullmatch(r'[A-Z0-9]{2,12}\.E',v)),None)
                    if ti is None or ti+6>=len(vals):continue
                    def nf(v):
                      try:return float(v)
                      except:
                        try:return float(str(v).replace(',','.'))
                        except:return np.nan
                    close=nf(vals[ti+6]); tail=[nf(v) for v in vals[ti+7:]];tail=[v for v in tail if np.isfinite(v)];turn=tail[-3] if len(tail)>=3 else np.nan;pit=1 if '>' in ' '.join(txt[:ti]) else 0
                    rows.append((ds,txt[ti][:-2],close,turn,pit))
                book.release_resources()
            except Exception as e:errs.append((ds,str(e)))
          if errs:raise RuntimeError('parse_errors:'+str(errs[:5]))
          p=pd.DataFrame(rows,columns=['date','symbol','close','turnover_try','bist100_pit']).sort_values(['date','symbol','turnover_try'],ascending=[1,1,0]).drop_duplicates(['date','symbol'])
          if p.date.nunique()!=len(days):raise RuntimeError(f'day_mismatch:{p.date.nunique()}:{len(days)}')
          os.makedirs('out',exist_ok=True);p.to_csv(f'out/CLOSE_PIT_{y}.csv.gz',index=False,compression='gzip');b[['date','close']].to_csv(f'out/XU100_{y}.csv',index=False)
          print(json.dumps({'year':y,'rows':len(p),'days':p.date.nunique(),'symbols':p.symbol.nunique(),'pit_min':int(p[p.bist100_pit==1].groupby('date').symbol.nunique().min()),'pit_max':int(p[p.bist100_pit==1].groupby('date').symbol.nunique().max())}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'mazda-legacy-${{ matrix.year }}', path: out/, retention-days: 30}
  test:
    needs: year
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pandas numpy
      - uses: actions/download-artifact@v4
        with: {pattern: 'mazda-legacy-*', path: all}
      - run: |
          cat > /tmp/test.py <<'PY'
          import glob,json,math,os
          import numpy as np,pandas as pd
          p=pd.concat([pd.read_csv(f) for f in glob.glob('all/**/CLOSE_PIT_*.csv.gz',recursive=True)],ignore_index=True);p['date']=pd.to_datetime(p.date);p=p.sort_values(['symbol','date'])
          b=pd.concat([pd.read_csv(f) for f in glob.glob('all/**/XU100_*.csv',recursive=True)],ignore_index=True);b['date']=pd.to_datetime(b.date);b=b.sort_values('date').drop_duplicates('date')
          # Corporate-action robust return: >30% daily raw jump is neutralized, matching prior MAZDA tests.
          p['rawret']=p.groupby('symbol').close.pct_change(fill_method=None);p['ret']=p.rawret.where(p.rawret.abs()<=0.30,0.0).fillna(0)
          # Build synthetic cleaned price path so momentum and MA are not distorted by splits/rights.
          p['px_clean']=p.groupby('symbol').ret.transform(lambda x:(1+x).cumprod())
          g=p.groupby('symbol',group_keys=False)
          p['mom120']=g.px_clean.pct_change(120);p['mom20']=g.px_clean.pct_change(20);p['ma20']=g.px_clean.transform(lambda x:x.rolling(20).mean());p['jump20']=p['mom20']
          # Benchmark cleaned daily returns and regime/volatility.
          b['ret']=b.close.pct_change(fill_method=None).fillna(0);b['mom60']=b.close.pct_change(60);b['vol20']=b.ret.rolling(20).std();b['vol60']=b.ret.rolling(60).std();b['vratio']=b.vol20/b.vol60
          bm=b.set_index('date')
          # Friday (or last trading day of Friday-less week) decision dates: week-ending Friday last available trading day.
          cal=pd.DataFrame({'date':sorted(p.date.unique())});cal['week']=cal.date.dt.to_period('W-FRI');reb=cal.groupby('week').date.max().tolist()
          # Signal at rebalance close, holdings earn returns after that close until next rebalance close. 30bp one-way turnover proxy per changed portfolio allocation.
          dates=sorted(p.date.unique()); retwide=p.pivot(index='date',columns='symbol',values='ret').fillna(0)
          equity=1.0; eq=[]; holdings=[]; wprev={}; cost_rate=.003
          for i,d in enumerate(reb[:-1]):
            nxt=reb[i+1]
            if d not in bm.index:continue
            br=bm.loc[d]
            market_ok=bool(pd.notna(br.mom60) and br.mom60>0 and pd.notna(br.vratio) and br.vratio<=1.20)
            snap=p[(p.date==d)&(p.bist100_pit==1)].copy()
            snap=snap[(snap.mom20>0)&(snap.px_clean>snap.ma20)&(snap.jump20<=0.50)&snap.mom120.notna()]
            picks=snap.nlargest(3,'mom120').symbol.tolist() if market_ok else []
            wnew={s:1/len(picks) for s in picks} if picks else {}
            # turnover = sum absolute weight changes; applying 30bp per unit turnover. Cash has implicit residual.
            turnover=sum(abs(wnew.get(s,0)-wprev.get(s,0)) for s in set(wnew)|set(wprev));equity*=max(0,1-cost_rate*turnover)
            period_dates=[x for x in dates if d<x<=nxt]
            for dd in period_dates:
              r=sum(w*retwide.at[dd,s] for s,w in wnew.items() if s in retwide.columns)
              equity*=1+r;eq.append((dd,equity,picks))
            wprev=wnew
          e=pd.DataFrame(eq,columns=['date','equity','picks']).drop_duplicates('date',keep='last').sort_values('date')
          # Align benchmark to strategy equity starting first strategy equity date.
          if e.empty:raise SystemExit('no_equity')
          bd=b[(b.date>=e.date.min())&(b.date<=e.date.max())].copy();bd['beq']=bd.close/bd.close.iloc[0]
          def cagr(series,dates):
            yrs=(dates.iloc[-1]-dates.iloc[0]).days/365.25;return series.iloc[-1]**(1/yrs)-1 if yrs>0 else np.nan
          def mdd(series):return (series/series.cummax()-1).min()
          yearly=[]
          e['year']=e.date.dt.year;bd['year']=bd.date.dt.year
          for y in range(2011,2016):
            ey=e[e.year==y];by=bd[bd.year==y]
            if len(ey): sr=ey.equity.iloc[-1]/ey.equity.iloc[0]-1
            else: sr=np.nan
            br=by.close.iloc[-1]/by.close.iloc[0]-1 if len(by)>1 else np.nan
            yearly.append({'year':y,'mazda':sr,'xu100':br})
          rep={'strategy':'MAZDA+PAS1-R Top-3 fixed','period':[str(e.date.min().date()),str(e.date.max().date())],'cagr':cagr(e.equity/e.equity.iloc[0],e.date),'maxdd':mdd(e.equity),'benchmark_cagr':cagr(bd.beq,bd.date),'benchmark_maxdd':mdd(bd.beq),'ending_multiple':float(e.equity.iloc[-1]/e.equity.iloc[0]),'benchmark_multiple':float(bd.beq.iloc[-1]),'yearly':yearly,'note':'2011 warmup-degraded because dataset starts 2011; fixed rules, no retuning.'}
          os.makedirs('final',exist_ok=True);open('final/MAZDA_2011_2015_BLIND_RESULT.json','w').write(json.dumps(rep,indent=2));e.to_csv('final/MAZDA_EQUITY_CURVE.csv',index=False);print(json.dumps(rep,indent=2))
          PY
          python /tmp/test.py
      - uses: actions/upload-artifact@v4
        with: {name: MAZDA_2011_2015_BLIND_RESULT, path: final/, retention-days: 30}
