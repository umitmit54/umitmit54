name: GPT BORSA Shadow Wikimedia Backfill Wikitext
on:
  push:
    branches: [gpt-borsa-shadow-20260818]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run conservative full-wikitext Wikimedia backfill
        run: python tools/wiki_shadow_wikitext.py
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-borsa-wiki-shadow-wikitext
          path: |
            wiki_shadow_rows_wikitext.csv
            wiki_shadow_weekly_wikitext.csv
            wiki_shadow_entity_map_wikitext.csv
          retention-days: 7
