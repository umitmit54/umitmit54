name: GPT BORSA KAP Company Diagnostic
on:
  push:
    branches: [gpt-borsa-shadow-20260818]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect KAP company-list response
        run: python tools/kap_company_diag.py
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-borsa-kap-company-diag
          path: kap_company_diag.json
          retention-days: 2
