name: GPT BORSA Shadow KAP Presence Backfill
on:
  push:
    branches: [gpt-borsa-shadow-20260818]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run official KAP 7-day timestamp backfill
        run: python tools/kap_shadow_collect_any.py
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-borsa-kap-shadow-any
          path: |
            kap_shadow_rows_any.csv
            kap_shadow_events_any.csv
          retention-days: 7
