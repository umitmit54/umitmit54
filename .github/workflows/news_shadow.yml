name: GPT BORSA Shadow Wikimedia Backfill Fast
on:
  push:
    branches: [gpt-borsa-shadow-20260818]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fast conservative Wikimedia 7d-vs-prior28d backfill
        run: python tools/wiki_shadow_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-borsa-wiki-shadow-fast
          path: |
            wiki_shadow_rows_fast.csv
            wiki_shadow_weekly_fast.csv
            wiki_shadow_entity_map_fast.csv
          retention-days: 7
