name: GPT BORSA Shadow Wikimedia Backfill IGS
on:
  push:
    branches: [gpt-borsa-shadow-20260818]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Wikimedia backfill with IGS issuer map
        run: python tools/run_wiki_shadow_fixed2.py
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-borsa-wiki-shadow-7v28-igs
          path: |
            wiki_shadow_rows_7v28.csv
            wiki_shadow_weekly_7v28.csv
          retention-days: 7
