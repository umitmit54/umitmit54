name: S5 V7 Historical XU100 2019-2020
on:
  push:
    paths:
      - 'bist-s4-backtest/historical_xu100_2019_2020.py'
      - 'bist-s4-backtest/s5_v7_historical_universe_2019_2020.py'
      - '.github/workflows/s5-v7-historical-universe.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r bist-s4-backtest/requirements.txt
      - name: Run historical-universe V7
        working-directory: bist-s4-backtest
        run: python s5_v7_historical_universe_2019_2020.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: s5-v7-historical-xu100-results
          path: bist-s4-backtest/output_s5v7_hist_2019_2020/
