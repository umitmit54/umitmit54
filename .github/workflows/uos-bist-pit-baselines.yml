name: UOS BIST PIT Baselines
on:
  push:
    paths:
      - '.github/workflows/uos-bist-pit-baselines.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pdfplumber requests pandas
      - name: Read glyph markers in official KAP matrices
        run: |
          cat > /tmp/extract.py <<'PY'
          import io,re,json,requests,pdfplumber,pandas as pd
          from pathlib import Path
          out=Path('pit_out'); out.mkdir(exist_ok=True)
          docs={
            '2011Q3':'https://kap.org.tr/tr/api/file/download/33E834372306023CE0530A4A622B5826',
            '2012Q2':'https://kap.org.tr/tr/api/file/download/33E8343736DC023CE0530A4A622B5826',
          }
          for label,url in docs.items():
              b=requests.get(url,timeout=60,headers={'User-Agent':'Mozilla/5.0'}); b.raise_for_status()
              pdf=pdfplumber.open(io.BytesIO(b.content)); rows=[]; glyphs=[]
              for pi,page in enumerate(pdf.pages):
                  words=page.extract_words(x_tolerance=2,y_tolerance=2,keep_blank_chars=False)
                  hdr=[w for w in words if w['text'].upper()=='XU100']
                  if not hdr: continue
                  hx=(hdr[0]['x0']+hdr[0]['x1'])/2; name_end=hdr[0]['x0']-2
                  # all glyph chars to right of stock-name region
                  chars=[]
                  for c in page.chars:
                      cx=(c['x0']+c['x1'])/2; cy=(c['top']+c['bottom'])/2
                      if c['x0']>=name_end:
                          chars.append((str(c.get('text','')),cx,cy,c.get('fontname','')))
                          glyphs.append({'page':pi+1,'text':str(c.get('text','')),'cx':round(cx,2),'cy':round(cy,2),'font':c.get('fontname','')})
                  groups=[]
                  for w in sorted(words,key=lambda x:(x['top'],x['x0'])):
                      placed=False
                      for g in groups[-6:]:
                          if abs(g[0]['top']-w['top'])<2.2: g.append(w); placed=True; break
                      if not placed: groups.append([w])
                  for g in groups:
                      left=[w for w in g if w['x1']<name_end]
                      if not left: continue
                      name=re.sub(r'\s+',' ',' '.join(w['text'] for w in sorted(left,key=lambda x:x['x0']))).strip()
                      if len(name)<3 or any(k in name.upper() for k in ['TARİHLERİ','HİSSE SENETLERİ','ULUSAL PAZAR','EK:']): continue
                      y=sum((w['top']+w['bottom'])/2 for w in left)/len(left)
                      near=[c for c in chars if abs(c[2]-y)<3.5]
                      rows.append({'page':pi+1,'name':name,'row_y':round(y,2),'xu100_header_x':round(hx,2),'glyphs':'|'.join(f'{c[0]}@{c[1]:.1f}' for c in near)})
              pd.DataFrame(rows).to_csv(out/f'{label}_ROWS_GLYPHS.csv',index=False)
              pd.DataFrame(glyphs).to_csv(out/f'{label}_ALL_GLYPHS.csv',index=False)
              sample=pd.DataFrame(rows)
              sample=sample[sample.name.str.contains('AKBANK|ACIBADEM|ARÇELİK|BİM MAĞAZALAR|BURÇELİK',case=False,regex=True)]
              sample.to_csv(out/f'{label}_SAMPLE.csv',index=False)
              print(label, sample.to_dict('records'))
          PY
          python /tmp/extract.py
      - uses: actions/upload-artifact@v4
        with:
          name: UOS_BIST_PIT_GLYPH_DIAG
          path: pit_out/
          retention-days: 30
