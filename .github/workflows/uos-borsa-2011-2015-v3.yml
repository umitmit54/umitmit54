name: UOS Borsa 2011-2015 Canonical V3
on:
  push:
    branches: [uos-borsa-data-job]
    paths: ['.github/workflows/uos-borsa-2011-2015-v3.yml']
  workflow_dispatch:
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        year: [2011, 2012, 2013, 2014, 2015]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pandas requests xlrd websocket-client git+https://github.com/rongardF/tvdatafeed.git
      - env: {YEAR: '${{ matrix.year }}'}
        run: |
          cat > /tmp/c.py <<'PY'
          import io,os,time,zipfile,json,re
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import pandas as pd,requests
          from tvDatafeed import TvDatafeed,Interval
          y=int(os.environ['YEAR']); tv=TvDatafeed(); bx=tv.get_hist('XU100','BIST',Interval.in_daily,n_bars=5000)
          if bx is None or bx.empty: raise RuntimeError('benchmark_empty')
          bx=bx.reset_index(); bx['date']=pd.to_datetime(bx.iloc[:,0],errors='coerce').dt.strftime('%Y-%m-%d'); bx=bx[(bx.date>=f'{y}-01-01')&(bx.date<=f'{y}-12-31')]
          exp=sorted(set(bx.date.dropna())); print('days',len(exp),flush=True)
          def req(k):
            ds,sess=k; d=pd.Timestamp(ds); u=f'https://borsaistanbul.com/data/thb/{d:%Y}/{d:%m}/thb{d:%Y%m%d}{sess}.zip'
            try:
              r=requests.get(u,timeout=20,headers={'User-Agent':'Mozilla/5.0 UOS/3'}); return k,(r.content if r.status_code==200 and r.content[:2]==b'PK' else None),r.status_code
            except Exception as e:return k,None,'ERR:'+type(e).__name__
          targets={(d,s) for d in exp for s in (1,2)}; got={};st={}; pending=set(targets)
          for a in range(1,6):
            with ThreadPoolExecutor(max_workers=16) as ex:
              for z in as_completed([ex.submit(req,k) for k in pending]):
                k,b,s=z.result();st[k]=s
                if b is not None:got[k]=b
            pending={k for k in pending if k not in got and (str(st.get(k,'')).startswith('ERR') or st.get(k) in (408,429,500,502,503,504))}
            print('fetch',a,'got',len(got),'retry',len(pending),flush=True)
            if not pending:break
            time.sleep(a)
          def fnum(x):
            try:return float(str(x).replace(',','.'))
            except:return float('nan')
          def xls_parse(raw,ds,sess):
            out=[]; book=pd.ExcelFile(io.BytesIO(raw),engine='xlrd')
            # Only stock-detail pages, e.g. N1- 1/K2- 1/L1- 1. Summaries (-2 etc.) are skipped.
            detail=[sh for sh in book.sheet_names if re.match(r'^[A-Z]+[12]-\s*1$',sh)]
            for sh in detail:
              d=pd.read_excel(io.BytesIO(raw),sheet_name=sh,header=None,engine='xlrd')
              for row in d.itertuples(index=False,name=None):
                vals=[str(v).strip() if pd.notna(v) else '' for v in row]; ti=next((i for i,v in enumerate(vals) if re.fullmatch(r'[A-Z0-9]{2,12}\.E',v)),None)
                if ti is None or ti+6>=len(vals):continue
                tail=[fnum(v) for v in vals[ti+7:]];tail=[v for v in tail if pd.notna(v)]
                out.append((ds,sess,vals[ti][:-2],vals[ti+1],fnum(vals[ti+3]),fnum(vals[ti+5]),fnum(vals[ti+4]),fnum(vals[ti+6]),tail[-2] if len(tail)>=2 else float('nan'),tail[-3] if len(tail)>=3 else float('nan'),1 if '>' in ' '.join(vals[:ti]) else 0))
            return pd.DataFrame(out,columns=['date','session','symbol','name','open','high','low','close','volume','turnover_try','bist100_pit'])
          def csv_parse(raw,ds,sess):
            text=raw.decode('cp1254',errors='replace');lines=text.splitlines();skip=1 if len(lines)>1 and lines[1].startswith('TRADE DATE;') else 0;d=pd.read_csv(io.StringIO(text),sep=';',skiprows=skip,low_memory=False)
            if 'INSTRUMENT SERIES CODE' not in d:return pd.DataFrame()
            q=d[(d['INSTRUMENT GROUP'].astype(str).str.strip()=='EQT')&d['INSTRUMENT SERIES CODE'].astype(str).str.endswith('.E')].copy()
            if q.empty:return pd.DataFrame()
            return pd.DataFrame({'date':ds,'session':sess,'symbol':q['INSTRUMENT SERIES CODE'].astype(str).str.replace(r'\.E$','',regex=True),'name':q['INSTRUMENT NAME'].astype(str),'open':pd.to_numeric(q['OPENING PRICE'],errors='coerce'),'high':pd.to_numeric(q['HIGHEST PRICE'],errors='coerce'),'low':pd.to_numeric(q['LOWEST PRICE'],errors='coerce'),'close':pd.to_numeric(q['CLOSING PRICE'],errors='coerce'),'volume':pd.to_numeric(q['TOTAL TRADED VOLUME'],errors='coerce'),'turnover_try':pd.to_numeric(q['TOTAL TRADED VALUE'],errors='coerce'),'bist100_pit':pd.to_numeric(q.get('BIST 100 INDEX',0),errors='coerce').fillna(0).astype('int8')})
          fs=[];errs=[];fm=[]
          for k,b in sorted(got.items()):
            ds,sess=k
            try:
              with zipfile.ZipFile(io.BytesIO(b)) as z:
                n=next((x for x in z.namelist() if x.lower().endswith(('.xls','.csv'))),None);raw=z.read(n) if n else None
              if not n:raise ValueError('no_supported_file')
              q=xls_parse(raw,ds,sess) if n.lower().endswith('.xls') else csv_parse(raw,ds,sess);fm.append((ds,sess,n,len(q)))
              if len(q):fs.append(q)
            except Exception as e:errs.append((ds,sess,str(e)))
          if not fs:raise RuntimeError('empty')
          s=pd.concat(fs,ignore_index=True).sort_values(['date','symbol','session','turnover_try'],ascending=[1,1,1,0]).drop_duplicates(['date','symbol','session'])
          rows=[]
          for (ds,sym),g in s.groupby(['date','symbol']):
            g=g.sort_values('session');op=g.open.dropna();cl=g.close.dropna();hi=g.high.dropna();lo=g.low.dropna()
            rows.append((ds,sym,g.name.iloc[-1],op.iloc[0] if len(op) else None,hi.max() if len(hi) else None,lo.min() if len(lo) else None,cl.iloc[-1] if len(cl) else None,g.volume.fillna(0).sum(),g.turnover_try.fillna(0).sum(),int(g.bist100_pit.max())))
          p=pd.DataFrame(rows,columns=['date','symbol','name','open','high','low','close','volume','turnover_try','bist100_pit']).sort_values(['date','symbol']);missing=sorted(set(exp)-set(p.date));counts=p[p.bist100_pit==1].groupby('date').symbol.nunique();bad=p[(p.high<p[['open','close','low']].max(axis=1))|(p.low>p[['open','close','high']].min(axis=1))]
          os.makedirs('out',exist_ok=True);p.to_csv(f'out/BIST_EQUITY_OHLCV_{y}.csv.gz',index=False,compression='gzip');bx[['date','open','high','low','close','volume']].to_csv(f'out/XU100_PRICE_OHLC_{y}.csv',index=False);pd.DataFrame(fm,columns=['date','session','file','rows']).to_csv(f'out/FORMAT_{y}.csv',index=False);pd.DataFrame(errs,columns=['date','session','error']).to_csv(f'out/ERRORS_{y}.csv',index=False)
          rep={'year':y,'benchmark_days':len(exp),'trading_days':int(p.date.nunique()),'rows':len(p),'symbols':int(p.symbol.nunique()),'missing':len(missing),'errors':len(errs),'ohlc_errors':len(bad),'pit_days':len(counts),'pit_min':int(counts.min()) if len(counts) else 0,'pit_max':int(counts.max()) if len(counts) else 0,'s1_files':sum((d,1) in got for d in exp),'s2_files':sum((d,2) in got for d in exp)};rep['complete']=bool(not missing and not errs and not len(bad) and len(counts)>=len(exp)*.95 and counts.max()<=100)
          open(f'out/QUALITY_{y}.json','w').write(json.dumps(rep,indent=2));print(json.dumps(rep),flush=True)
          if not rep['complete']:raise RuntimeError('gate')
          PY
          python /tmp/c.py
      - uses: actions/upload-artifact@v4
        with: {name: 'legacy-${{ matrix.year }}', path: out/, retention-days: 30}
  combine:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pandas
      - uses: actions/download-artifact@v4
        with: {pattern: 'legacy-*', path: all}
      - run: |
          python - <<'PY'
          import glob,json,os,pandas as pd
          os.makedirs('final',exist_ok=True);p=pd.concat([pd.read_csv(f) for f in glob.glob('all/**/BIST_EQUITY*.gz',recursive=True)]).sort_values(['date','symbol']).drop_duplicates(['date','symbol']);b=pd.concat([pd.read_csv(f) for f in glob.glob('all/**/XU100*.csv',recursive=True)]).sort_values('date').drop_duplicates('date');reps=sorted([json.load(open(f)) for f in glob.glob('all/**/QUALITY*.json',recursive=True)],key=lambda x:x['year']);missing=set(b.date)-set(p.date);extra=set(p.date)-set(b.date)
          p.to_csv('final/BIST_EQUITY_OHLCV_2011-01-01_2015-12-31.csv.gz',index=False,compression='gzip');b.insert(1,'symbol','XU100');b.to_csv('final/XU100_PRICE_OHLC_2011-01-01_2015-12-31.csv',index=False);rep={'equity_rows':len(p),'days':p.date.nunique(),'symbols':p.symbol.nunique(),'benchmark_days':len(b),'missing':len(missing),'extra':len(extra),'years':reps,'complete':not missing and not extra and all(x['complete'] for x in reps)};open('final/QUALITY_REPORT.json','w').write(json.dumps(rep,indent=2));print(json.dumps(rep),flush=True)
          if not rep['complete']:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: UOS_BORSA_2011_2015_CANONICAL_COMPLETE_V3, path: final/, retention-days: 30}
