name: UOS Official Legacy PIT 2011-2015
on:
  push:
    paths:
      - '.github/workflows/uos_pit_legacy_full.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow requests xlrd==2.0.1
      - name: Extract official daily PIT and XU100
        run: |
          cat > /tmp/pit.py <<'PY'
          import io, re, json, zipfile, unicodedata
          from pathlib import Path
          from datetime import date, timedelta
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import pandas as pd, requests, xlrd

          OUT=Path('pit_out'); OUT.mkdir(exist_ok=True)
          TICK=re.compile(r'^[A-Z0-9]{2,12}\.E$')
          H={'User-Agent':'Mozilla/5.0'}

          def norm(s):
              s=str(s or '').strip().upper().replace('İ','I').replace('Ş','S').replace('Ğ','G').replace('Ü','U').replace('Ö','O').replace('Ç','C')
              return ' '.join(s.split())

          def parse_day(dt):
              ds=dt.strftime('%Y%m%d'); url=f'https://borsaistanbul.com/data/thb/{dt.year}/{dt.month:02d}/thb{ds}1.zip'
              rec={'date':dt.isoformat(),'url':url}
              try:
                  r=requests.get(url,headers=H,timeout=40)
                  rec['http']=r.status_code
                  if r.status_code==404: return rec,[],None
                  r.raise_for_status()
                  if r.content[:2]!=b'PK':
                      rec['error']='not_zip'; return rec,[],None
                  z=zipfile.ZipFile(io.BytesIO(r.content))
                  xs=[n for n in z.namelist() if n.lower().endswith('.xls')]
                  if not xs:
                      rec['error']='no_xls'; return rec,[],None
                  book=xlrd.open_workbook(file_contents=z.read(xs[0]))
                  listed=set(); members=set(); bench=None
                  for sh in book.sheets():
                      # benchmark from Endeksler
                      if norm(sh.name)=='ENDEKSLER':
                          for i in range(sh.nrows):
                              row=sh.row_values(i)
                              if not row: continue
                              nm=norm(row[0])
                              if nm in ('IMKB 100','BIST 100') and len(row)>=12:
                                  try:
                                      bench={'date':dt.isoformat(),'index_name':nm,
                                             'price_open':float(row[1]),'price_low':float(row[2]),'price_high':float(row[3]),'price_close':float(row[4]),
                                             'price_prev_close':float(row[5]) if row[5] != '' else None,
                                             'return_close':float(row[8]) if row[8] != '' else None,
                                             'return_prev_close':float(row[9]) if row[9] != '' else None,
                                             'source':'BIST_OFFICIAL_TBULT_S1'}
                                  except Exception: pass
                      # listed/PIT symbols by exact .E cells; membership marker is immediately before ticker
                      for i in range(sh.nrows):
                          row=sh.row_values(i)
                          for j,v in enumerate(row):
                              sv=str(v).strip().upper()
                              if TICK.match(sv):
                                  sym=sv[:-2]
                                  listed.add(sym)
                                  prev=str(row[j-1]).strip() if j>0 else ''
                                  if '>' in prev:
                                      members.add(sym)
                  rec.update({'listed_count':len(listed),'bist100_count':len(members),'benchmark_ok':bench is not None,'status':'ok'})
                  daily=[{'date':dt.isoformat(),'symbol':s,'listed':1,'bist100_pit':1 if s in members else 0,'source':'BIST_OFFICIAL_TBULT_S1'} for s in sorted(listed)]
                  return rec,daily,bench
              except Exception as e:
                  rec['error']=repr(e); rec['status']='error'; return rec,[],None

          dates=[]
          d=date(2011,1,1); end=date(2015,7,31)
          while d<=end:
              if d.weekday()<5: dates.append(d)
              d+=timedelta(days=1)

          audits=[]; rows=[]; benches=[]
          with ThreadPoolExecutor(max_workers=16) as ex:
              fut={ex.submit(parse_day,d):d for d in dates}
              for k,f in enumerate(as_completed(fut),1):
                  a,r,b=f.result(); audits.append(a); rows.extend(r)
                  if b: benches.append(b)
                  if k%100==0: print('processed',k,'of',len(dates),flush=True)

          aud=pd.DataFrame(audits).sort_values('date')
          pit=pd.DataFrame(rows)
          ben=pd.DataFrame(benches).sort_values('date')
          if len(pit): pit=pit.sort_values(['date','symbol']).drop_duplicates(['date','symbol'])
          aud.to_csv(OUT/'PIT_DOWNLOAD_AUDIT_2011_2015.csv',index=False)
          pit.to_parquet(OUT/'PIT_BIST100_OFFICIAL_DAILY_2011_2015.parquet',index=False)
          pit.to_csv(OUT/'PIT_BIST100_OFFICIAL_DAILY_2011_2015.csv.gz',index=False,compression='gzip')
          ben.to_csv(OUT/'XU100_OFFICIAL_PRICE_RETURN_2011_2015.csv',index=False)
          trading=aud[aud.get('status','').eq('ok')].copy() if 'status' in aud else pd.DataFrame()
          count_dist=trading['bist100_count'].value_counts().sort_index().to_dict() if len(trading) else {}
          bad_counts=trading[~trading['bist100_count'].between(95,105)] if len(trading) else pd.DataFrame()
          bad_counts.to_csv(OUT/'PIT_COUNT_ANOMALIES.csv',index=False)
          summary={'requested_weekdays':len(dates),'official_trading_days':int(len(trading)),'pit_rows':int(len(pit)),'unique_symbols':int(pit.symbol.nunique()) if len(pit) else 0,'benchmark_days':int(len(ben)),'bist100_count_distribution':{str(k):int(v) for k,v in count_dist.items()},'count_anomaly_days':int(len(bad_counts)),'status':'QC_REVIEW_REQUIRED' if len(bad_counts) else 'PASS'}
          (OUT/'SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python /tmp/pit.py
      - uses: actions/upload-artifact@v4
        with:
          name: UOS_PIT_XU100_OFFICIAL_2011_2015
          path: pit_out/
          retention-days: 30
