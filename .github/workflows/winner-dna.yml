name: Winner DNA Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'bist-s4-backtest/winner_dna.py'
      - '.github/workflows/winner-dna.yml'

jobs:
  dna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bist-s4-backtest/requirements.txt
      - name: Install dependencies
        run: pip install -r bist-s4-backtest/requirements.txt
      - name: Run winner DNA analysis
        run: python bist-s4-backtest/winner_dna.py
      - name: Upload winner DNA results
        uses: actions/upload-artifact@v4
        with:
          name: winner-dna-results
          path: bist-s4-backtest/output_winner_dna/*.csv
          if-no-files-found: error
          retention-days: 30
