name: UOS Benchmark Probe TEMP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uos-benchmark-probe-temp.yml'
      - 'uos-benchmark-probe-temp.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas yfinance
      - run: python uos-benchmark-probe-temp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UOS_BENCHMARK_PROBE_TEMP
          path: uos-benchmark-probe-output/
          if-no-files-found: warn
          retention-days: 2
