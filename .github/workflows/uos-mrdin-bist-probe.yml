name: UOS MRDIN BIST Probe
on:
  push:
    branches: [uos-data-collector-20260906]
    paths:
      - 'uos-data-collector/probe_mrdin_bist_2020.py'
      - '.github/workflows/uos-mrdin-bist-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas requests
      - run: python uos-data-collector/probe_mrdin_bist_2020.py
      - uses: actions/upload-artifact@v4
        with:
          name: UOS_MRDIN_BIST_2020
          path: uos-mrdin-bist/
          retention-days: 7
