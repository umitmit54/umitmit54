name: UOS BIST Benchmark Actions
on:
  push:
    paths:
      - '.github/workflows/uos-bist-benchmark-actions.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow yfinance requests
      - name: Build benchmark and expanded actions
        run: |
          cat > /tmp/build.py <<'PY'
          import io,json,requests,pandas as pd,yfinance as yf
          from pathlib import Path
          out=Path('uos_out'); out.mkdir(exist_ok=True)
          # XU100 2011-2015
          q=yf.download('XU100.IS',start='2010-12-01',end='2016-01-05',auto_adjust=False,actions=False,progress=False)
          if isinstance(q.columns,pd.MultiIndex): q.columns=q.columns.get_level_values(0)
          q=q.reset_index(); q=q[(q.Date>='2011-01-01')&(q.Date<='2015-12-31')].dropna(subset=['Close']).copy()
          q['source']='YAHOO'; q['source_symbol']='XU100.IS'
          q.to_csv(out/'XU100_BENCHMARK_2011_2015.csv',index=False); q.to_parquet(out/'XU100_BENCHMARK_2011_2015.parquet',index=False)
          # Universe = official 2016 history + current BIST list + known PIT legacy extras
          syms=[]
          p=Path('data/historical_universe_2016.txt')
          if p.exists(): syms += [x.strip() for x in p.read_text().splitlines() if x.strip()]
          try:
              r=requests.get('https://www.borsaistanbul.com/datum/hisse_endeks_ds.csv',headers={'User-Agent':'Mozilla/5.0'},timeout=60); r.raise_for_status()
              d=pd.read_csv(io.StringIO(r.text),sep=';',encoding='utf-8-sig'); d.columns=[str(c).strip() for c in d.columns]
              if len(d): d=d.iloc[1:]
              for x in d.get('BILESEN KODU',[]):
                  s=str(x).strip().replace('.E','')
                  if s and s!='nan': syms.append(s)
          except Exception: pass
          syms += 'ADNAC AKFEN ANACM ASYAB AVISA BMEKS BOYNR DYHOL FINBN GOLDS IPEKE ITTFH KILER KOZAA KOZAL MUTLU NTTUR PEGYO PTOFS RHEAG SAFGY SODA TEBNK TEKST TIRE TRKCM YAZIC YKSGR'.split()
          syms=sorted(set(syms))
          rows=[]; audit=[]
          for s in syms:
              try:
                  a=yf.Ticker(s+'.IS').actions
                  if a is None or len(a)==0: audit.append({'symbol':s,'status':'no_actions'}); continue
                  a=a.reset_index(); dc='Date' if 'Date' in a.columns else a.columns[0]
                  a[dc]=pd.to_datetime(a[dc],errors='coerce',utc=True).dt.tz_convert(None)
                  a=a[(a[dc]>='2011-01-01')&(a[dc]<='2026-12-31')]
                  for _,r in a.iterrows():
                      div=float(r.get('Dividends',0) or 0); split=float(r.get('Stock Splits',0) or 0)
                      if div!=0 or split!=0: rows.append({'date':r[dc].date().isoformat(),'ticker':s,'dividend':div,'split_ratio':split,'source':'YAHOO_ACTIONS'})
              except Exception as e: audit.append({'symbol':s,'status':'error','error':repr(e)})
          acts=pd.DataFrame(rows,columns=['date','ticker','dividend','split_ratio','source'])
          acts.to_csv(out/'CORPORATE_ACTIONS_2011_2026_YAHOO.csv',index=False); acts.to_parquet(out/'CORPORATE_ACTIONS_2011_2026_YAHOO.parquet',index=False)
          pd.DataFrame(audit).to_csv(out/'CORPORATE_ACTIONS_AUDIT.csv',index=False)
          summary={'benchmark_rows':len(q),'benchmark_status':'PASS' if len(q)>=1000 else 'PARTIAL','action_symbols_seeded':len(syms),'action_events':len(acts),'actions_status':'SECONDARY_SOURCE'}
          (out/'SUMMARY.json').write_text(json.dumps(summary,indent=2),encoding='utf-8'); print(json.dumps(summary,indent=2))
          PY
          python /tmp/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: UOS_BIST_BENCHMARK_ACTIONS_EXPANDED
          path: uos_out/
          retention-days: 30
