name: UOS Borsa 2011-2015 Canonical
on:
  push:
    branches: [uos-borsa-data-job]
    paths: ['.github/workflows/uos-borsa-2011-2015.yml']
  workflow_dispatch:

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        year: [2011, 2012, 2013, 2014, 2015]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pandas requests websocket-client git+https://github.com/rongardF/tvdatafeed.git
      - env:
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import io,os,time,zipfile,json
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import pandas as pd,requests
          from tvDatafeed import TvDatafeed,Interval
          y=int(os.environ['YEAR']); tv=TvDatafeed()
          bx=tv.get_hist(symbol='XU100',exchange='BIST',interval=Interval.in_daily,n_bars=5000)
          if bx is None or bx.empty: raise RuntimeError('benchmark_empty')
          bx=bx.reset_index(); bx['date']=pd.to_datetime(bx.iloc[:,0],errors='coerce').dt.strftime('%Y-%m-%d')
          bx=bx[(bx.date>=f'{y}-01-01')&(bx.date<=f'{y}-12-31')]
          exp=sorted(set(bx.date.dropna())); print('benchmark_days',len(exp),flush=True)
          if not exp: raise RuntimeError('no_expected_dates')
          def f(ds):
            d=pd.Timestamp(ds); u=f'https://borsaistanbul.com/data/thb/{d:%Y}/{d:%m}/thb{d:%Y%m%d}1.zip'
            try:
              r=requests.get(u,timeout=20,headers={'User-Agent':'Mozilla/5.0 UOS-Borsa-Research/1.0'})
              return ds,(r.content if r.status_code==200 and r.content[:2]==b'PK' else None),r.status_code
            except Exception as e:return ds,None,'ERR:'+type(e).__name__
          got={};status={};pending=set(exp)
          for a in range(1,7):
            if not pending: break
            with ThreadPoolExecutor(max_workers=8) as ex:
              for z in as_completed([ex.submit(f,d) for d in sorted(pending)]):
                ds,b,s=z.result(); status[ds]=s
                if b is not None: got[ds]=b
            pending=set(exp)-set(got); print('attempt',a,'pending',len(pending),flush=True)
            if pending: time.sleep(a*2)
          frames=[];errs=[]
          for ds,b in sorted(got.items()):
            try:
              with zipfile.ZipFile(io.BytesIO(b)) as z:
                raw=z.read([n for n in z.namelist() if n.lower().endswith('.csv')][0])
              text=raw.decode('cp1254',errors='replace'); lines=text.splitlines(); skip=1 if len(lines)>1 and lines[1].startswith('TRADE DATE;') else 0
              d=pd.read_csv(io.StringIO(text),sep=';',skiprows=skip,low_memory=False)
              req=['INSTRUMENT SERIES CODE','INSTRUMENT NAME','INSTRUMENT GROUP','BIST 100 INDEX','OPENING PRICE','LOWEST PRICE','HIGHEST PRICE','CLOSING PRICE','TOTAL TRADED VOLUME','TOTAL TRADED VALUE']
              miss=[c for c in req if c not in d.columns]
              if miss: raise ValueError('missing_columns:'+','.join(miss))
              q=d[(d['INSTRUMENT GROUP'].astype(str).str.strip()=='EQT')&d['INSTRUMENT SERIES CODE'].astype(str).str.endswith('.E')].copy()
              if q.empty: raise ValueError('no_equity_rows')
              frames.append(pd.DataFrame({'date':ds,'symbol':q['INSTRUMENT SERIES CODE'].astype(str).str.replace(r'\.E$','',regex=True),'name':q['INSTRUMENT NAME'].astype(str).str.strip(),'open':pd.to_numeric(q['OPENING PRICE'],errors='coerce'),'high':pd.to_numeric(q['HIGHEST PRICE'],errors='coerce'),'low':pd.to_numeric(q['LOWEST PRICE'],errors='coerce'),'close':pd.to_numeric(q['CLOSING PRICE'],errors='coerce'),'volume':pd.to_numeric(q['TOTAL TRADED VOLUME'],errors='coerce'),'turnover_try':pd.to_numeric(q['TOTAL TRADED VALUE'],errors='coerce'),'bist100_pit':pd.to_numeric(q['BIST 100 INDEX'],errors='coerce').fillna(0).astype('int8'),'source':'BIST_thb_'+pd.Timestamp(ds).strftime('%Y%m%d')+'1'}))
            except Exception as e: errs.append((ds,str(e)))
          os.makedirs('out',exist_ok=True)
          p=pd.concat(frames,ignore_index=True).dropna(subset=['date','symbol']).sort_values(['date','symbol']) if frames else pd.DataFrame()
          if p.empty: raise RuntimeError('panel_empty')
          dups=int(p.duplicated(['date','symbol']).sum()); p=p.drop_duplicates(['date','symbol'],keep='last')
          bad=p[(p.high<p[['open','close','low']].max(axis=1))|(p.low>p[['open','close','high']].min(axis=1))]
          missing=sorted(set(exp)-set(p.date.unique())); counts=p[p.bist100_pit==1].groupby('date').symbol.nunique()
          p.to_csv(f'out/BIST_EQUITY_OHLCV_{y}.csv.gz',index=False,compression='gzip')
          bx[['date','open','high','low','close','volume']].to_csv(f'out/XU100_PRICE_OHLC_{y}.csv',index=False)
          pd.DataFrame([{'date':d,'http_status':status.get(d),'downloaded':d in got} for d in exp]).to_csv(f'out/BULLETIN_MANIFEST_{y}.csv',index=False)
          pd.DataFrame({'date':missing}).to_csv(f'out/MISSING_{y}.csv',index=False)
          pd.DataFrame(errs,columns=['date','error']).to_csv(f'out/PARSE_ERRORS_{y}.csv',index=False)
          rep={'year':y,'expected_benchmark_dates':len(exp),'official_bulletins_downloaded':len(got),'equity_trading_dates':int(p.date.nunique()),'rows':int(len(p)),'symbols':int(p.symbol.nunique()),'missing_dates':len(missing),'parse_errors':len(errs),'duplicate_rows_before_dedup':dups,'ohlc_invariant_errors':int(len(bad)),'bist100_count_min':int(counts.min()) if len(counts) else None,'bist100_count_max':int(counts.max()) if len(counts) else None}
          rep['year_complete']=bool(not missing and not errs and len(bad)==0 and len(p)>0)
          open(f'out/QUALITY_{y}.json','w').write(json.dumps(rep,ensure_ascii=False,indent=2)); print(json.dumps(rep,ensure_ascii=False),flush=True)
          if not rep['year_complete']: raise RuntimeError('year_gate_failed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bist-old-${{ matrix.year }}
          path: out/
          retention-days: 30

  combine:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: bist-old-*
          path: all
      - run: |
          python - <<'PY'
          import glob,json,os,hashlib
          import pandas as pd
          os.makedirs('final',exist_ok=True)
          pf=glob.glob('all/**/BIST_EQUITY_OHLCV_*.csv.gz',recursive=True)
          p=pd.concat([pd.read_csv(f) for f in pf],ignore_index=True).sort_values(['date','symbol']).drop_duplicates(['date','symbol'],keep='last')
          bf=glob.glob('all/**/XU100_PRICE_OHLC_*.csv',recursive=True)
          b=pd.concat([pd.read_csv(f) for f in bf],ignore_index=True).sort_values('date').drop_duplicates('date',keep='last')
          reps=sorted([json.load(open(f)) for f in glob.glob('all/**/QUALITY_*.json',recursive=True)],key=lambda r:r['year'])
          missing=sorted(set(b.date)-set(p.date)); extra=sorted(set(p.date)-set(b.date))
          p.to_csv('final/BIST_EQUITY_OHLCV_2011-01-01_2015-12-31.csv.gz',index=False,compression='gzip')
          b.insert(1,'symbol','XU100'); b['source']='TradingView:BIST:XU100'
          b.to_csv('final/XU100_PRICE_OHLC_2011-01-01_2015-12-31.csv',index=False)
          mans=glob.glob('all/**/BULLETIN_MANIFEST_*.csv',recursive=True); pd.concat([pd.read_csv(f) for f in mans],ignore_index=True).sort_values('date').to_csv('final/BULLETIN_DOWNLOAD_MANIFEST.csv',index=False)
          pd.DataFrame({'date':missing}).to_csv('final/TRUE_MISSING_BULLETIN_DATES.csv',index=False); pd.DataFrame({'date':extra}).to_csv('final/BENCHMARK_GAP_DATES.csv',index=False)
          errs=glob.glob('all/**/PARSE_ERRORS_*.csv',recursive=True); ee=pd.concat([pd.read_csv(f) for f in errs],ignore_index=True) if errs else pd.DataFrame(columns=['date','error']); ee.to_csv('final/PARSE_ERRORS.csv',index=False)
          rep={'period':['2011-01-01','2015-12-31'],'equity_rows':int(len(p)),'equity_trading_dates':int(p.date.nunique()),'unique_symbols':int(p.symbol.nunique()),'benchmark_rows':int(len(b)),'missing_bulletin_dates_vs_benchmark':len(missing),'benchmark_gap_dates':len(extra),'parse_error_rows':int(len(ee)),'years':reps}
          rep['complete_gate']=bool(len(p)>0 and len(b)==int(p.date.nunique()) and not missing and not extra and len(ee)==0 and all(r['year_complete'] for r in reps))
          open('final/QUALITY_REPORT.json','w').write(json.dumps(rep,ensure_ascii=False,indent=2))
          checks={os.path.basename(f):hashlib.sha256(open(f,'rb').read()).hexdigest() for f in glob.glob('final/*')}; open('final/SHA256SUMS.json','w').write(json.dumps(checks,indent=2))
          print(json.dumps(rep,ensure_ascii=False,indent=2))
          if not rep['complete_gate']: raise SystemExit('FINAL QUALITY GATE FAILED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UOS_BORSA_2011_2015_CANONICAL_COMPLETE
          path: final/
          retention-days: 30
