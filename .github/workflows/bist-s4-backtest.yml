name: BIST S4-S5 Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'bist-s4-backtest/**'
      - '.github/workflows/bist-s4-backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bist-s4-backtest/requirements.txt
      - name: Install dependencies
        run: pip install -r bist-s4-backtest/requirements.txt
      - name: Run S4 backtest
        run: python bist-s4-backtest/backtest.py
      - name: Run S5 V1 leader-radar backtest
        run: python bist-s4-backtest/s5_backtest.py
      - name: Run S5 V2 KAP event radar
        run: python bist-s4-backtest/s5_v2_event.py
      - name: Upload S4 results
        uses: actions/upload-artifact@v4
        with:
          name: bist-s4-backtest-results
          path: bist-s4-backtest/output/*.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload S5 V1 results
        uses: actions/upload-artifact@v4
        with:
          name: bist-s5-backtest-results
          path: bist-s4-backtest/output_s5/*.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload S5 V2 results
        uses: actions/upload-artifact@v4
        with:
          name: bist-s5v2-backtest-results
          path: bist-s4-backtest/output_s5v2/*.csv
          if-no-files-found: error
          retention-days: 30
