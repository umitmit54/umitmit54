name: UOS BIST Current Sectors
on:
  push:
    branches: [uos-data-collector-20260906]
    paths:
      - 'uos-data-collector/collect_bist_current_sectors.py'
      - '.github/workflows/uos-bist-current-sectors.yml'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas requests
      - run: python uos-data-collector/collect_bist_current_sectors.py
      - uses: actions/upload-artifact@v4
        with:
          name: UOS_BIST_CURRENT_SECTORS
          path: uos-data-collector/bist_current_sectors
          retention-days: 14
