name: Probe investpy legacy IDs
on:
  push:
    paths:
      - 'bist-s4-backtest/probe_investpy_ids.py'
      - '.github/workflows/probe-investpy-ids.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - run: python bist-s4-backtest/probe_investpy_ids.py
