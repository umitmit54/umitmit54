name: GPT BORSA KAP Shadow Backfill
on:
  pull_request:
    branches: [main]
    paths:
      - "gpt-borsa-shadow/**"
      - ".github/workflows/gpt-borsa-actions-test.yml"
permissions:
  contents: read
jobs:
  kap-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch KAP shadow data
        run: python gpt-borsa-shadow/kap_only.py
      - name: Upload KAP shadow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpt-borsa-kap-shadow
          path: |
            kap_only_backfill.csv
            kap_weekly_summary.csv
            kap_overall.json
          retention-days: 7
