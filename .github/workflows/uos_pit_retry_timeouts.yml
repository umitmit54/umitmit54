name: UOS Legacy PIT Retry Timeouts
on:
  push:
    paths:
      - '.github/workflows/uos_pit_retry_timeouts.yml'
      - 'data/legacy_pit_retry_dates.txt'
  workflow_dispatch:

jobs:
  retry:
    strategy:
      fail-fast: false
      matrix:
        year: [2011, 2012, 2013, 2014, 2015]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow requests xlrd==2.0.1
      - name: Retry timeout days
        env:
          YEAR: ${{ matrix.year }}
        run: |
          cat > /tmp/retry.py <<'PY'
          import io,re,json,zipfile,os,time
          from pathlib import Path
          from datetime import date
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import pandas as pd, requests, xlrd
          Y=int(os.environ['YEAR']); OUT=Path('out'); OUT.mkdir(exist_ok=True)
          dates=[date.fromisoformat(x.strip()) for x in Path('data/legacy_pit_retry_dates.txt').read_text().splitlines() if x.strip().startswith(str(Y))]
          TICK=re.compile(r'^[A-Z0-9]{2,12}\.E$'); H={'User-Agent':'Mozilla/5.0'}
          def norm(s): return ' '.join(str(s or '').strip().upper().replace('İ','I').replace('Ş','S').replace('Ğ','G').replace('Ü','U').replace('Ö','O').replace('Ç','C').split())
          def fetch(dt):
              ds=dt.strftime('%Y%m%d'); url=f'https://borsaistanbul.com/data/thb/{Y}/{dt.month:02d}/thb{ds}1.zip'; last=None
              for attempt in range(5):
                  try:
                      r=requests.get(url,headers=H,timeout=60)
                      if r.status_code==404:return {'date':dt.isoformat(),'http':404,'status':'404'},[],None
                      r.raise_for_status()
                      if r.content[:2]!=b'PK': raise ValueError('not_zip')
                      z=zipfile.ZipFile(io.BytesIO(r.content)); xs=[n for n in z.namelist() if n.lower().endswith('.xls')]
                      if not xs: raise ValueError('no_xls')
                      b=xlrd.open_workbook(file_contents=z.read(xs[0])); listed=set(); mem=set(); bench=None
                      for sh in b.sheets():
                          if norm(sh.name)=='ENDEKSLER':
                              for i in range(sh.nrows):
                                  row=sh.row_values(i); nm=norm(row[0]) if row else ''
                                  if nm in ('IMKB 100','BIST 100') and len(row)>=12:
                                      try: bench={'date':dt.isoformat(),'index_name':nm,'price_open':float(row[1]),'price_low':float(row[2]),'price_high':float(row[3]),'price_close':float(row[4]),'price_prev_close':float(row[5]) if row[5]!='' else None,'return_close':float(row[8]) if row[8]!='' else None,'return_prev_close':float(row[9]) if row[9]!='' else None,'source':'BIST_OFFICIAL_TBULT_S1'}
                                      except: pass
                          for i in range(sh.nrows):
                              row=sh.row_values(i)
                              for j,v in enumerate(row):
                                  sv=str(v).strip().upper()
                                  if TICK.match(sv):
                                      s=sv[:-2]; listed.add(s)
                                      if j>0 and '>' in str(row[j-1]): mem.add(s)
                      a={'date':dt.isoformat(),'http':200,'status':'ok','listed_count':len(listed),'bist100_count':len(mem),'benchmark_ok':bench is not None,'attempt':attempt+1}
                      rows=[{'date':dt.isoformat(),'symbol':s,'listed':1,'bist100_pit':int(s in mem),'source':'BIST_OFFICIAL_TBULT_S1'} for s in sorted(listed)]
                      return a,rows,bench
                  except Exception as e:
                      last=repr(e); time.sleep(2+attempt*3)
              return {'date':dt.isoformat(),'status':'error','error':last},[],None
          audits=[];rows=[];ben=[]
          with ThreadPoolExecutor(max_workers=3) as ex:
              fut=[ex.submit(fetch,d) for d in dates]
              for f in as_completed(fut):
                  a,r,b=f.result(); audits.append(a); rows.extend(r); ben.extend([b] if b else [])
          aud=pd.DataFrame(audits).sort_values('date'); pit=pd.DataFrame(rows); bench=pd.DataFrame(ben).sort_values('date') if ben else pd.DataFrame()
          if len(pit): pit=pit.sort_values(['date','symbol']).drop_duplicates(['date','symbol'])
          aud.to_csv(OUT/f'RETRY_AUDIT_{Y}.csv',index=False); pit.to_parquet(OUT/f'RETRY_PIT_{Y}.parquet',index=False); bench.to_csv(OUT/f'RETRY_XU100_{Y}.csv',index=False)
          ok=aud[aud.status.eq('ok')] if len(aud) else pd.DataFrame(); bad=ok[ok.bist100_count.ne(100)] if len(ok) else pd.DataFrame()
          s={'year':Y,'requested':len(dates),'recovered':len(ok),'still_failed':int((aud.status=='error').sum()) if len(aud) else 0,'not_found_404':int((aud.status=='404').sum()) if len(aud) else 0,'count_anomalies':len(bad)}
          (OUT/f'RETRY_SUMMARY_{Y}.json').write_text(json.dumps(s,indent=2),encoding='utf-8'); print(json.dumps(s,indent=2))
          PY
          python /tmp/retry.py
      - uses: actions/upload-artifact@v4
        with:
          name: PIT_RETRY_${{ matrix.year }}
          path: out/
          retention-days: 30
