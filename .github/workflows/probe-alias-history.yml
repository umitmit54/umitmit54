name: Probe alias BIST history
on:
  push:
    paths:
      - 'bist-s4-backtest/probe_alias_history.py'
      - '.github/workflows/probe-alias-history.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bist-s4-backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python probe_alias_history.py
