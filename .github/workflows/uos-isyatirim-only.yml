name: UOS IsYatirim Only Collector
on:
  push:
    branches: [uos-data-collector-20260906]
    paths:
      - 'uos-data-collector/collect_isyatirim_only.py'
      - 'uos-data-collector/symbols_2019_2026.json'
      - '.github/workflows/uos-isyatirim-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas
      - run: python uos-data-collector/collect_isyatirim_only.py
      - name: Package
        if: always()
        run: |
          cd uos-data-collector
          if [ -d isyatirim_output ]; then zip -qr UOS_ISYATIRIM_241_2026-09-06.zip isyatirim_output; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UOS_ISYATIRIM_241_2026-09-06
          path: |
            uos-data-collector/UOS_ISYATIRIM_241_2026-09-06.zip
            uos-data-collector/isyatirim_output/
          if-no-files-found: warn
          retention-days: 14
