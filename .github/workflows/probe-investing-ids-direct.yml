name: Probe Investing IDs direct
on:
  push:
    paths:
      - 'bist-s4-backtest/probe_investing_ids_direct.py'
      - '.github/workflows/probe-investing-ids-direct.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python bist-s4-backtest/probe_investing_ids_direct.py
